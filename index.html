const ITEMS=GROUPS.flatMap(g=>g.items);

const PRESETS=[
  {
    name:"Слои · полдень · цвет",
    ids:["layers","color_layers"],
    time:"hard midday sunlight",
    hint:"Также устанавливает жёсткий полуденный свет."
  },
  {
    name:"Стекло · акцент · телевик",
    ids:["glass","accent","tele"],
    hint:"Оптику и объекты не меняет — проверьте их отдельно."
  },
  {
    name:"Луч · силуэт · масштаб",
    ids:["shaft","silhouette","scale"]
  },
  {
    name:"Момент · эхо · чистые края",
    ids:["moment","visual_rhyme","clean_edges"]
  },
  {
    name:"Смаз · обрез · вспышка",
    ids:["rough","crop","flash"]
  },
  {
    name:"Рама · взгляд · пустота",
    ids:["frame_in_frame","gaze_out","negative"]
  }
];

function normalizeComposition(raw){
  const ids=Array.isArray(raw?.ids)
    ?[...new Set(raw.ids.filter(id=>BY_ID.has(id)))]:[];
  return {
    enabled:typeof raw?.enabled==="boolean"?raw.enabled:true,
    ids
  };
}
function composition(){
  if(!state.composition)state.composition=normalizeComposition();
  return state.composition;
}
function selectedItems(){
  const c=composition();
  return c.enabled?c.ids.map(id=>BY_ID.get(id)).filter(Boolean):[];
}

/*
  Оригинальный загрузчик v2 не знает о новом поле.
  Расширяем валидацию и восстанавливаем поле из localStorage.
*/
const originalValidate=validateProject;
validateProject=function(data){
  const result=originalValidate(data);
  result.composition=normalizeComposition(data?.state?.composition);
  return result;
};

state.composition=normalizeComposition();
try{
  const saved=JSON.parse(localStorage.getItem(STORE)||"null");
  if(saved){
    const checked=validateProject(saved);
    // Не подменяем текущую сцену, если базовый загрузчик её не восстановил.
    if(JSON.stringify(checked.objects)===JSON.stringify(state.objects)){
      state.composition=checked.composition;
    }
  }
}catch{}

const originalExample=example;
example=function(){
  const result=originalExample();
  result.composition=normalizeComposition();
  return result;
};

  </p>
`;

left.insertBefore(panel,left.children[1]||null);

const catalog=$("compResults");
GROUPS.forEach((group,index)=>{
  const section=document.createElement("details");
  section.className="comp-section";
  section.open=index===0;
  section.dataset.group=String(index);

  const summary=document.createElement("summary");
  summary.textContent=group.title;
  section.append(summary);

  for(const item of group.items){
    const [id,name,mj,nb,effect,master]=item;
    const row=document.createElement("div");
    row.className="comp-item";
    row.dataset.compItem=id;
    row.dataset.search=item.join(" ").toLocaleLowerCase("ru");

    const labelEl=document.createElement("label");
    const checkbox=document.createElement("input");
    checkbox.type="checkbox";
    checkbox.dataset.compId=id;
    const title=document.createElement("span");
    title.textContent=name;
    labelEl.append(checkbox,title);

    const desc=document.createElement("div");
    desc.className="comp-desc";
    desc.textContent=effect+" · "+master;

    const examples=document.createElement("details");
    examples.className="comp-example";
    const heading=document.createElement("summary");
    heading.textContent="Формулировки MJ / NB";
    const pMJ=document.createElement("p");
    pMJ.textContent="MJ: "+mj;
    const pNB=document.createElement("p");
    pNB.textContent="NB: "+nb;
    examples.append(heading,pMJ,pNB);
    row.append(labelEl,desc,examples);
    section.append(row);
  }
  catalog.append(section);
});

PRESETS.forEach(preset=>{
  const b=document.createElement("button");
  b.type="button";
  b.textContent=preset.name;
  b.title=preset.hint||"Заменить набор выбранных приёмов";
  b.onclick=()=>{
    change(()=>{
      state.composition={enabled:true,ids:[...preset.ids]};
      if(preset.time)state.config.time=preset.time;
    });
    say("Сочетание применено. "+(preset.hint||"Проверьте соответствие сцене."));
  };
  $("compPresetButtons").append(b);
});

$("compEnabled").onchange=()=>{
  change(()=>composition().enabled=$("compEnabled").checked);
};
$("compClear").onclick=()=>{
  change(()=>composition().ids=[]);
};
catalog.addEventListener("change",e=>{
  const input=e.target.closest("[data-comp-id]");
  if(!input)return;
  const id=input.dataset.compId;
  change(()=>{
    const c=composition();
    if(input.checked){
      if(!c.ids.includes(id))c.ids.push(id);
    }else c.ids=c.ids.filter(x=>x!==id);
  });
});

$("compSearch").oninput=()=>{
  const q=$("compSearch").value.trim().toLocaleLowerCase("ru");
  for(const section of catalog.querySelectorAll(".comp-section")){
    let found=0;
    for(const row of section.querySelectorAll(".comp-item")){
      const match=!q||row.dataset.search.includes(q);
      row.hidden=!match;
      if(match)found++;
    }
    section.hidden=found===0;
    if(q&&found)section.open=true;
  }
};

function renderComposition(){
  const c=composition();
  $("compEnabled").checked=c.enabled;
  $("compBody").classList.toggle("comp-disabled",!c.enabled);
  $("compCount").textContent=
    `Выбрано: ${c.ids.length}${c.enabled?"":" · выключено"}`;

  for(const input of catalog.querySelectorAll("[data-comp-id]")){
    input.checked=c.ids.includes(input.dataset.compId);
  }

  const chips=$("compSelected");
  chips.replaceChildren();
  for(const id of c.ids){
    const item=BY_ID.get(id);
    if(!item)continue;
    const b=document.createElement("button");
    b.type="button";
    b.className="comp-chip";
    b.textContent=item[1]+" ×";
    b.title="Убрать приём";
    b.onclick=()=>change(()=>{
      composition().ids=composition().ids.filter(x=>x!==id);
    });
    chips.append(b);
  }
}

// ---------- Добавление в промпты ----------
const originalPrompts=prompts;
prompts=function(){
  const base=originalPrompts();
  const items=selectedItems();
  if(!items.length)return base;

  const scene=state.config.scene.trim()||"An everyday urban street scene.";

  function insertAfterScene(text,addition){
    const i=text.indexOf(scene);
    if(i<0)return text+" "+addition;
    const at=i+scene.length;
    return text.slice(0,at)+" "+addition+" "+text.slice(at).trimStart();
  }

  base.mj=insertAfterScene(
    base.mj,
    "Composition: "+items.map(x=>x[2]).join("; ")+"."
  );
  base.nb=insertAfterScene(
    base.nb,
    items.map(x=>x[3]).join(" ")
  );
  return base;
};

// ---------- Мягкая проверка конфликтов ----------
const originalUpdateOutput=updateOutput;
updateOutput=function(){
  originalUpdateOutput();

  const items=selectedItems();
  if(!items.length)return;
  const ids=new Set(items.map(x=>x[0]));
  const warnings=[];
  const has=id=>ids.has(id);
  const pair=(a,b,message)=>{
    if(has(a)&&has(b))warnings.push(message);
  };
  const objects=state.objects.filter(active);
  const hero=objects.find(o=>o.main);
  const people=objects.filter(o=>o.type==="person");

  if(items.length>3){
    warnings.push(
      "Выбрано больше трёх композиционных приёмов. Это разрешено, " +
      "но конкурирующие инструкции могут ослабить основной замысел."
    );
  }

  pair("thirds","symmetry",
    "Правило третей и центральная симметрия предлагают разное положение главного героя.");
  pair("low_horizon","high_horizon",
    "Одновременно выбраны низкий и высокий горизонт.");
  pair("low_key","high_key",
    "Низкий и высокий ключ задают противоположное распределение тонов.");
  pair("clean_edges","crop",
    "Чистые края и агрессивный обрез могут противоречить друг другу.");
  pair("gaze_out","eye_contact",
    "Взгляд за пределы кадра и взгляд в камеру конфликтуют, если относятся к одному герою.");
  pair("near_far","tele",
    "Ближний-дальний и телекомпрессия предполагают разные пространственные решения.");
  pair("silhouette","eye_contact",
    "У силуэта без деталей лица прямой зрительный контакт может быть неразличим.");
  pair("layers","middle_focus",
    "В MJ трёхплановость из таблицы включает deep focus, а эшелон резкости размывает передний и задний планы.");
  pair("mono_palette","neon",
    "Гамма одного оттенка конкурирует с двухцветной неоновой палитрой.");

  if(has("absence")&&people.length)
    warnings.push("Приём «Отсутствие человека» выбран, но в сцене есть активные герои.");

  if(has("all_over")&&hero)
    warnings.push("Выбран кадр без центра, но один объект помечен главным.");

  if(has("thirds")&&hero&&hero.x>.4)
    warnings.push("Формулировка правила третей ставит героя слева, а на схеме он расположен иначе.");

  if(has("symmetry")&&hero&&Math.abs(hero.x-.5)>.08)
    warnings.push("Для центральной композиции главный объект на схеме заметно смещён от центра.");

  if(has("triangle")&&people.length!==3)
    warnings.push("Приём «Треугольники» описывает трёх персонажей; число героев на схеме другое.");

  if(has("tele")&&Number(state.config.lens)<85)
    warnings.push("Телекомпрессия выбрана вместе с широким или нормальным полем зрения. Проверьте дистанцию и оптику.");

  if(has("near_far")&&Number(state.config.lens)>35)
    warnings.push("Пример «Ближний-дальний» предполагает широкий угол; выбран более узкий.");

  if(has("hip")&&state.config.height!=="hip-level viewpoint")
    warnings.push("Приём «Съёмка от бедра» не совпадает с выбранной точкой камеры.");

  if(has("miss_focus")&&state.config.focus==="subject")
    warnings.push("Расфокус героя противоречит настройке «Герой резкий, фон мягкий».");

  if(has("middle_focus")&&state.config.focus==="deep")
    warnings.push("Эшелон резкости конфликтует с общей настройкой читаемости всех планов.");

  if(has("flash")&&!state.config.time.includes("night"))
    warnings.push("Табличный пример вспышки описывает ночь, а окружающий свет задан иначе.");

  if(has("shaft")&&state.config.time.includes("night"))
    warnings.push("Пример луча света описывает солнце между зданиями, но сцена настроена на ночь.");

  const colorIds=["accent","pattern_break","complementary","color_blocks",
    "mono_palette","color_layers","neon"];

  if(["trix","hp5"].includes(state.config.film)&&colorIds.some(has))
    warnings.push("Цветовые композиционные приёмы выбраны вместе с чёрно-белой эстетикой.");

  for(const text of warnings){
    const p=document.createElement("p");
    p.textContent="• Композиция: "+text;
    p.style.color="#e2c58e";
    $("warnings").append(p);
  }
};

// ---------- Световое пятно ----------
const stage=document.querySelector(".center .stage");
const lightToggle=document.createElement("label");
lightToggle.className="check muted";
lightToggle.innerHTML=`
  <input id="showLightSpots" type="checkbox" checked>
  Показывать условные световые пятна
`;
stage.after(lightToggle);
$("showLightSpots").onchange=()=>draw();

function lightSpotsMarkup(){
  if(!$("showLightSpots")?.checked)return "";
  const {w,h}=dims();
  const objects=state.objects.filter(o=>!o.hidden);
  let result="";

  for(const source of objects.filter(o=>o.type==="light")){
    const target=objects.find(o=>o.id===source.target)
      ||objects.find(o=>o.main);

    const x=(target?.x??source.x)*w;
    const y=(target?.y??source.y)*h;
    const sizeW=target?Math.max(target.w*w*1.4,90):w*.18;
    const sizeH=target?Math.max(target.h*h*.8,75):h*.2;
    const soft=source.lightQuality==="soft";
    const color={
      warm:"#ffd08b",
      neutral:"#e9f0ff",
      cool:"#87caff"
    }[source.lightColor]||"#e9f0ff";

    const shift={
      left:[-sizeW*.3,0],
      right:[sizeW*.3,0],
      above:[0,-sizeH*.28],
      behind:[0,0],
      front:[0,0]
    }[source.lightPosition]||[0,0];

    const cx=x+shift[0],cy=y+shift[1];
    const gradientId="frame-light-"+source.id;
    const opacity=source.lightRole==="key"?.38:.22;

    result+=`
      <defs>
        <radialGradient id="${gradientId}">
          <stop offset="0" stop-color="${color}" stop-opacity="${opacity}"/>
          <stop offset="${soft?"50%":"78%"}"
            stop-color="${color}" stop-opacity="${opacity*.5}"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse cx="${cx}" cy="${cy}" rx="${sizeW}" ry="${sizeH}"
        fill="url(#${gradientId})" pointer-events="none"/>`;

    if(source.lightPosition==="behind"){
      result+=`
        <ellipse cx="${x}" cy="${y}" rx="${sizeW*.6}" ry="${sizeH*.8}"
          fill="none" stroke="${color}" stroke-opacity=".35"
          stroke-width="5" pointer-events="none"/>`;
    }
  }
  return result;
}

const originalSvgContent=svgContent;
svgContent=function(mode="editor"){
  let content=originalSvgContent(mode);
  if(mode==="clean")return content;

  const glow=lightSpotsMarkup();
  if(glow){
    // Ставим пятна поверх фоновой заливки, но под объектами.
    const marker='fill="#223044"/>';
    const index=content.indexOf(marker);
    if(index>=0){
      const at=index+marker.length;
      content=content.slice(0,at)+glow+content.slice(at);
    }
  }
  return content;
};

// ---------- Ручки изменения размера ----------
let resizeSession=null;
const canvas=$("canvas");

const originalDraw=draw;
draw=function(){
  originalDraw();
  const o=current();
  if(!o||o.hidden||o.locked)return;

  const {w,h}=dims();
  const ow=o.w*w,oh=o.h*h;
  const group=document.createElementNS(NS,"g");
  group.setAttribute(
    "transform",
    `translate(${o.x*w} ${o.y*h}) rotate(${o.rotation})`
  );
  group.setAttribute("aria-hidden","true");

  const handles=[
    ["nw",-ow/2,-oh/2,"nwse-resize"],
    ["n",0,-oh/2,"ns-resize"],
    ["ne",ow/2,-oh/2,"nesw-resize"],
    ["e",ow/2,0,"ew-resize"],
    ["se",ow/2,oh/2,"nwse-resize"],
    ["s",0,oh/2,"ns-resize"],
    ["sw",-ow/2,oh/2,"nesw-resize"],
    ["west",-ow/2,0,"ew-resize"]
  ];

  for(const [name,x,y,cursor] of handles){
    const rect=document.createElementNS(NS,"rect");
    rect.dataset.resize=name;
    rect.setAttribute("x",x-7);
    rect.setAttribute("y",y-7);
    rect.setAttribute("width","14");
    rect.setAttribute("height","14");
    rect.setAttribute("rx","3");
    rect.setAttribute("fill","#b7ed78");
    rect.setAttribute("stroke","#101721");
    rect.setAttribute("stroke-width","2");
    rect.style.cursor=cursor;
    group.append(rect);
  }
  canvas.append(group);
};

canvas.addEventListener("pointerdown",e=>{
  const handle=e.target.closest("[data-resize]");
  if(!handle||e.button!==0)return;
  const o=current();
  if(!o||o.locked)return;
  const p=point(e);
  if(!p)return;

  e.preventDefault();
  e.stopImmediatePropagation();

  const {w,h}=dims();
  const angle=o.rotation*Math.PI/180;
  resizeSession={
    pointer:e.pointerId,
    id:o.id,
    handle:handle.dataset.resize,
    before:serialize(),
    centerX:o.x*w,
    centerY:o.y*h,
    cos:Math.cos(angle),
    sin:Math.sin(angle),
    originalW:o.w,
    originalH:o.h
  };
  canvas.setPointerCapture(e.pointerId);
  canvas.focus({preventScroll:true});
},true);

canvas.addEventListener("pointermove",e=>{
  if(!resizeSession||resizeSession.pointer!==e.pointerId)return;
  e.preventDefault();
  e.stopImmediatePropagation();

  const s=resizeSession;
  const o=state.objects.find(x=>x.id===s.id);
  const p=point(e);
  if(!o||!p)return;

  const {w,h}=dims();
  const dx=p.x-s.centerX,dy=p.y-s.centerY;

  // Координаты указателя в локальной системе повёрнутого объекта.
  const localX=dx*s.cos+dy*s.sin;
  const localY=-dx*s.sin+dy*s.cos;

  const horizontal=!["n","s"].includes(s.handle);
  const vertical=!["e","west"].includes(s.handle);

  let nextW=horizontal?Math.abs(localX)*2/w:s.originalW;
  let nextH=vertical?Math.abs(localY)*2/h:s.originalH;

  if(e.shiftKey){
    let factor;
    if(horizontal&&vertical){
      factor=Math.max(nextW/s.originalW,nextH/s.originalH);
    }else factor=horizontal?nextW/s.originalW:nextH/s.originalH;

    const minFactor=Math.max(.02/s.originalW,.02/s.originalH);
    const maxFactor=Math.min(1.5/s.originalW,1.5/s.originalH);
    factor=clamp(factor,minFactor,maxFactor);

    nextW=s.originalW*factor;
    nextH=s.originalH*factor;
  }

  o.w=clamp(nextW,.02,1.5);
  o.h=clamp(nextH,.02,1.5);

  draw();
  syncEditor();
  updateOutput();
},true);

function finishResize(e){
  if(!resizeSession)return;
  if(e.pointerId!==undefined&&e.pointerId!==resizeSession.pointer)return;
  e.stopImmediatePropagation();
  const before=resizeSession.before;
  resizeSession=null;
  remember(before);
  render();
}
for(const event of ["pointerup","pointercancel","lostpointercapture"]){
  canvas.addEventListener(event,finishResize,true);
}

// Не допускаем удаления объекта горячей клавишей во время resize.
document.addEventListener("keydown",e=>{
  if(!resizeSession)return;
  e.preventDefault();
  e.stopImmediatePropagation();
},true);

// ---------- Обновление общего интерфейса ----------
const originalRender=render;
render=function(){
  composition();
  originalRender();
  renderComposition();
};

const resizeHelp=document.createElement("p");
resizeHelp.className="muted";
resizeHelp.textContent=
  "Размер: потяните зелёные ручки выбранного объекта. " +
  "Изменение идёт относительно его центра. " +
  "Shift сохраняет пропорции. Точные значения доступны справа.";
lightToggle.after(resizeHelp);

render();
say("Добавлены композиционные приёмы, изменение размера и световые пятна.");
})();
</script>
